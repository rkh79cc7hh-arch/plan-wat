<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plan WAT - WLO25ZX3S1</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --accent: #38bdf8;
      --sub: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .status {
      font-size: 0.8rem;
      color: var(--sub);
      margin-top: 4px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }
    .card-title {
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 0.85rem;
      color: var(--sub);
      line-height: 1.4;
    }
    .btn-orig {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      margin-top: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>WLO25ZX3S1 • WAT</h1>
    <div class="status" id="status">Wczytywanie planu...</div>
  </header>

  <div class="grid" id="plan-container"></div>

  <a class="btn-orig" href="./plan.htm" target="_blank">Otwórz pełną oryginalną siatkę WAT ↗</a>

  <script>
    fetch('./plan.htm')
      .then(r => {
        if (!r.ok) throw new Error();
        return r.arrayBuffer();
      })
      .then(buffer => {
        // Dekodowanie kodowania stron WAT (windows-1250 lub iso-8859-2)
        const decoder = new TextDecoder('windows-1250');
        const html = decoder.decode(buffer);
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const container = document.getElementById('plan-container');
        const rows = doc.querySelectorAll('tr');
        let count = 0;

        rows.forEach(row => {
          const text = row.innerText.trim().replace(/\s+/g, ' ');
          if (text.length > 5 && !text.includes('Incapsula')) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="card-meta">${text}</div>`;
            container.appendChild(card);
            count++;
          }
        });

        document.getElementById('status').innerText = count > 0 
          ? `Plan załadowany pomyślnie (${count} wpisów)`
          : 'Plan załadowany (brak bezpośrednich wierszy w tabeli)';
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Dodaj plik plan.htm do repozytorium.';
      });
  </script>
</body>
</html>
