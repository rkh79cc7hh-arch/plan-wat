<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plan WAT - WLO25ZX3S1</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --accent: #38bdf8;
      --sub: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .status {
      font-size: 0.8rem;
      color: var(--sub);
      margin-top: 4px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(10px);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .highlight {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .btn-orig {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      margin-top: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>WLO25ZX3S1 • WAT</h1>
    <div class="status" id="status">Wczytywanie planu...</div>
  </header>

  <div class="grid" id="plan-container"></div>

  <a class="btn-orig" href="./plan.htm" target="_blank">Otwórz pełny plik źródłowy ↗</a>

  <script>
    fetch('./plan.htm?v=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error();
        return r.arrayBuffer();
      })
      .then(buffer => {
        // Dekodowanie znaków polskich
        let text = new TextDecoder('windows-1250').decode(buffer);
        if (text.includes('')) {
          text = new TextDecoder('utf-8').decode(buffer);
        }

        const container = document.getElementById('plan-container');
        
        // Podział na linie tekstu
        const rawLines = text.split(/\r?\n/)
          .map(l => l.replace(/\u00a0/g, ' ').trim())
          .filter(l => l.length > 0);

        // Grupowanie linii w czytelne bloki
        let blocks = [];
        let currentBlock = [];

        for (const line of rawLines) {
          // Jeśli trafiamy na godziny (np. 1-2, 3-4, 5-6, 7-8) lub nowy przedmiot, rozpoczynamy nowy blok
          if (/^\d-\d$/.test(line) || /^[A-Z][a-ząćęłńóśźż\s]{4,}/.test(line)) {
            if (currentBlock.length > 0) {
              blocks.push(currentBlock);
              currentBlock = [];
            }
          }
          currentBlock.push(line);
        }
        if (currentBlock.length > 0) blocks.push(currentBlock);

        // Wyświetlanie kafelków
        let count = 0;
        blocks.forEach(blk => {
          const content = blk.join('\n');
          if (content.length > 3) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="highlight">${blk[0]}</div>` + blk.slice(1).join('<br>');
            container.appendChild(card);
            count++;
          }
        });

        document.getElementById('status').innerText = `Załadowano pozycje planu (${count})`;
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Błąd wczytywania pliku plan.htm';
      });
  </script>
</body>
</html>
