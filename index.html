<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plan WAT</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px 40px 16px;
    }
    header {
      padding: 20px 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .status-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--subtext);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .class-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .class-text {
      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
    }
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--subtext);
    }
    .btn-wat {
      display: block;
      width: 100%;
      text-align: center;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid var(--card-border);
      font-weight: 600;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Twój Plan Zajęć</h1>
      <div style="color: var(--subtext); font-size: 13px; margin-top: 2px;">WAT • WLO25ZX3S1</div>
    </div>
  </header>

  <div class="status-bar">
    <span><span class="status-dot"></span> Aktywny</span>
    <span id="last-update">Sprawdzanie...</span>
  </div>

  <div id="schedule-container">
    <div class="loader">Ładowanie Twoich zajęć...</div>
  </div>

  <a class="btn-wat" href="https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm" target="_blank">
    Otwórz oryginalną tabelę WAT ↗
  </a>

  <script>
    fetch('plan.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('last-update').innerText = data.last_checked || 'Aktualny';
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        if (!data.table || data.table.length === 0) {
          container.innerHTML = '<div class="loader">Brak danych w planie.</div>';
          return;
        }

        // Renderujemy wiersze z planu
        data.table.forEach(row => {
          const content = row.join(' • ');
          if (content.length > 3) {
            const card = document.createElement('div');
            card.className = 'class-card';
            card.innerHTML = `<div class="class-text">${content}</div>`;
            container.appendChild(card);
          }
        });
      })
      .catch(err => {
        document.getElementById('schedule-container').innerHTML = '<div class="loader">Błąd wczytywania planu.</div>';
      });
  </script>
</body>
</html>
