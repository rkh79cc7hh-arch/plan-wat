name: Monitor Planu WAT

on:
  schedule:
    # Uruchamiaj co 1 godzinę w ciągu dnia
    - cron: '0 6-20 * * *'
  workflow_dispatch: # Pozwala odpalić ręcznie w każdej chwili

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja narzędzi
        run: pip install requests beautifulsoup4

      - name: Sprawdź plan WAT
        run: |
          python - << 'EOF'
          import requests
          import hashlib
          import json
          import os
          from datetime import datetime

          URL = "https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm"
          resp = requests.get(URL, headers={"User-Agent": "Mozilla/5.0"})
          resp.encoding = 'iso-8859-2'
          content = resp.text

          h = hashlib.sha256(content.encode('utf-8')).hexdigest()
          changed = False

          if os.path.exists("hash.txt"):
              with open("hash.txt") as f:
                  if f.read().strip() != h:
                      changed = True
          else:
              changed = True

          with open("hash.txt", "w") as f:
              f.write(h)

          now = datetime.now().strftime("%d.%m.%Y %H:%M")
          data = {
              "group": "WLO25ZX3S1",
              "last_checked": now,
              "status": "Wykryto zmianę w planie na stronie WAT!" if changed else "Brak nowych zmian. Plan aktualny."
          }

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Status: {data['status']}")
          EOF

      - name: Zapisz stan w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hash.txt plan.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja stanu planu" && git push)
