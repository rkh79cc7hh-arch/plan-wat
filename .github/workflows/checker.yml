name: Monitor Planu WAT

on:
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci
        run: pip install requests beautifulsoup4

      - name: Pobierz plan WAT przez posrednika
        run: |
          python - << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          from datetime import datetime

          TARGET_URL = "https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm"
          
          # Lista darmowych bramek proxy omijajacych blokady chmurowe
          proxies_services = [
              f"https://api.allorigins.win/raw?url={requests.utils.quote(TARGET_URL)}",
              f"https://corsproxy.io/?url={requests.utils.quote(TARGET_URL)}"
          ]

          html_text = ""
          for proxy_url in proxies_services:
              try:
                  res = requests.get(proxy_url, timeout=20)
                  if res.status_code == 200 and "Incapsula" not in res.text:
                      html_text = res.text
                      break
              except Exception:
                  continue

          rows_data = []

          if html_text:
              soup = BeautifulSoup(html_text, 'html.parser')
              for tr in soup.find_all('tr'):
                  cells = [td.get_text(" ", strip=True) for td in tr.find_all(['td', 'th'])]
                  clean = [c for c in cells if c]
                  if clean:
                      rows_data.append(clean)

          now = datetime.now().strftime("%d.%m.%Y %H:%M")

          output = {
              "group": "WLO25ZX3S1",
              "last_checked": now,
              "table": rows_data
          }

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Pobrano wierszy: {len(rows_data)}")
          EOF

      - name: Zapisz stan w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plan.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja bazy planu" && git push)
