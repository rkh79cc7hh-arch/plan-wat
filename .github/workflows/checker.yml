name: Monitor Planu WAT

on:
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja narzedzi
        run: pip install requests beautifulsoup4 lxml

      - name: Przetworz plan WAT
        run: |
          python - << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          from datetime import datetime

          URL = "https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm"
          
          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "pl-PL,pl;q=0.9,en-US;q=0.8,en;q=0.7",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "Sec-Ch-Ua": '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"',
              "Sec-Ch-Ua-Mobile": "?0",
              "Sec-Ch-Ua-Platform": '"Windows"',
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "none",
              "Sec-Fetch-User": "?1",
              "Upgrade-Insecure-Requests": "1"
          }

          resp = session.get(URL, headers=headers, timeout=20)
          resp.encoding = 'iso-8859-2'
          soup = BeautifulSoup(resp.text, 'html.parser')

          rows_data = []

          # Parsowanie tabeli
          for tr in soup.find_all('tr'):
              cells = [td.get_text(" ", strip=True) for td in tr.find_all(['td', 'th'])]
              clean_cells = [c for c in cells if c]
              if clean_cells:
                  rows_data.append(clean_cells)

          # Filtrowanie ewentualnych komunikatów Incapsula
          rows_data = [r for r in rows_data if "Incapsula" not in " ".join(r)]

          now = datetime.now().strftime("%d.%m.%Y %H:%M")

          output = {
              "group": "WLO25ZX3S1",
              "last_checked": now,
              "table": rows_data
          }

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Pobrano wierszy: {len(rows_data)}")
          EOF

      - name: Zapisz stan w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plan.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja bazy planu" && git push)
