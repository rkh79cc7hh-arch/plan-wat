name: Monitor Planu WAT

on:
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja Playwright i zaleznosci
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Pobierz plan WAT ze wszystkich ramek
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import json
          from datetime import datetime
          import time

          URL = "https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm"

          rows_data = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              
              page.goto(URL, wait_until="networkidle", timeout=60000)
              time.sleep(4)

              # Sprawdz glowna strone oraz wszystkie ramki (iframe/frame)
              frames = [page.main_frame] + page.frames

              for frame in frames:
                  try:
                      content = frame.content()
                      soup = BeautifulSoup(content, 'html.parser')
                      for tr in soup.find_all('tr'):
                          cells = [td.get_text(" ", strip=True) for td in tr.find_all(['td', 'th'])]
                          clean = [c for c in cells if c]
                          if clean and "Incapsula" not in " ".join(clean):
                              rows_data.append(clean)
                  except Exception as e:
                      pass

              # Jesli nie ma tr, zbierzmy widoczne linie tekstu ze strony
              if not rows_data:
                  text_content = page.inner_text("body")
                  lines = [line.strip() for line in text_content.split("\n") if len(line.strip()) > 3]
                  for line in lines:
                      if "Incapsula" not in line:
                          rows_data.append([line])

              browser.close()

          now = datetime.now().strftime("%d.%m.%Y %H:%M")

          output = {
              "group": "WLO25ZX3S1",
              "last_checked": now,
              "table": rows_data
          }

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Liczba pobranych pozycji: {len(rows_data)}")
          EOF

      - name: Zapisz stan w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plan.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja bazy planu" && git push)
