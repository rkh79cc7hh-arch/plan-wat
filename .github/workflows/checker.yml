name: Monitor Planu WAT

on:
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja narzedzi
        run: pip install requests beautifulsoup4 lxml

      - name: Przetworz plan WAT
        run: |
          python - << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import os
          from datetime import datetime

          URL = "https://wlo.wat.edu.pl/planzajec/zima/WLO25ZX3S1.htm"
          resp = requests.get(URL, headers={"User-Agent": "Mozilla/5.0"})
          resp.encoding = 'iso-8859-2'
          soup = BeautifulSoup(resp.text, 'html.parser')

          # Sprawdzenie tabeli
          table = soup.find('table')
          rows_data = []

          if table:
              for tr in table.find_all('tr'):
                  cells = [td.get_text(separator=" ", strip=True) for td in tr.find_all(['td', 'th'])]
                  if any(cells):
                      rows_data.append(cells)

          now = datetime.now().strftime("%d.%m.%Y %H:%M")

          output = {
              "group": "WLO25ZX3S1",
              "last_checked": now,
              "table": rows_data
          }

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Pobrano {len(rows_data)} wierszy planu.")
          EOF

      - name: Zapisz stan w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plan.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja bazy planu" && git push)
